# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: weather1116

# Infra-only: azd provisions the wx1116-prd-* resources below via Bicep.
# There is deliberately no `services:` block, so `azd deploy` has nothing
# to do. Application code deploys continue through the existing
# .github/workflows/prod-deploy-*.yml workflows (OIDC + az cli /
# azure/webapps-deploy / Azure/functions-action / Azure/static-web-apps-deploy)
# against the *current* weather1116-prod-* resources, unchanged. A future
# workflow can point at the wx1116-prd-* names once app code is ready.
infra:
  provider: bicep
  path: infra
  module: main
