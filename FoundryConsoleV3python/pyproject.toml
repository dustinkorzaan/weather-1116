[project]
name = "foundry-console-v3-python"
version = "0.1.0"
description = "Python port of FoundryConsoleV3: Responses API with in-process tool callbacks (geo + public weather tools)."
requires-python = ">=3.11"
dependencies = [
    "openai>=3.22",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
foundry-console-v3-python = "foundry_console_v3:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["foundry_console_v3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
