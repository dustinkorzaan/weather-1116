# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - weather1116-prod-mvc
run-name: Deploy MVC to Production

on:
  workflow_run:
    workflows:
      - Build Backend and Frontend
    # branches:
    #   - main
    types:
      - completed
  # Keep manual trigger for emergency redeploys and controlled production rollouts.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./mvc-dotnet/WeatherMVC/WeatherMVC.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./mvc-dotnet/WeatherMVC/WeatherMVC.csproj -c Release -o "${{ github.workspace }}/publish/mvc-dotnet"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mvc-dotnet

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mvc-dotnet
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC33B15CFEB14C0A96A09F238B85FA81 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C4BBF9C6B62C4946BC529FCDC0A439C5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3BA500ADC50B4A158533F08E0159AECA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'weather1116-prod-mvc'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/mvc-dotnet
          