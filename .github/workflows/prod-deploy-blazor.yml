name: cicd-wx1116-prod-blazor
run-name: CICD wx1116-prod-blazor (App Service)

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: prod-deploy-blazor
  cancel-in-progress: true

env:
  RESOURCE_GROUP: wx1116-prod-rg
  APP_NAME: wx1116-prod-blazor
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.ref_name }}

jobs:
  deploy:
    # Called via workflow_call from build-test-provision-deploy.yml with
    # needs: [provision] -- deploys App Services that infra provisions, so
    # they must run after it, not concurrently with it. workflow_dispatch
    # still runs unconditionally for manual deploys on any branch.
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_MI_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Publish and deploy to App Service
        uses: ./.github/actions/deploy-app-service
        with:
          csproj: ui-blazor/blazor/WeatherBlazor.csproj
          app_name: ${{ env.APP_NAME }}
          resource_group: ${{ env.RESOURCE_GROUP }}
          secrets_multiline: |
            google-maps-key=${{ secrets.GOOGLE_MAPS_API_KEY }}
          env_overlay_multiline: |
            API_DOTNET_URL=${{ vars.PROD_API_DOTNET_URL }}
            UI_REACT_URL=${{ vars.PROD_UI_REACT_URL }}
            UI_BLAZOR_URL=${{ vars.PROD_UI_BLAZOR_URL }}
            MVC_URL=${{ vars.PROD_MVC_DOTNET_URL }}
            WORKER_DOTNET_URL=${{ vars.PROD_WORKER_DOTNET_URL }}
            GOOGLE_MAPS_API_KEY=secretref:google-maps-key
            ASPNETCORE_DETAILEDERRORS=false
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_START=${{ steps.build_start.outputs.build_start }}
            BUILD_BRANCH_NAME=${{ env.BUILD_BRANCH_NAME }}
