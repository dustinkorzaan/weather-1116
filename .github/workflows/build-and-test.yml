name: Build and Test
run-name: Build and Test

on:
  # pull_request:
  #   branches:
  #     - main
  push:

# Newer pushes cancel older in-progress builds for the same ref (e.g. main).
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - core-dotnet/Core.csproj
          - api-dotnet/WeatherAPI/WeatherAPI.csproj
          - ui-blazor/WeatherBlazor/WeatherBlazor.csproj
          - mvc-dotnet/WeatherMVC/WeatherMVC.csproj
          - mcp-function/WeatherMcpFunction.csproj
          - mcp-dotnet/WeatherMcpDotNet.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

  test-weather-api:
    name: Test Weather API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run Weather API tests
        run: dotnet test api-dotnet/test/WeatherAPI.Tests/WeatherAPI.Tests.csproj --configuration Release --verbosity normal

  build-and-test-react:
    name: Build and Test React Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-react

      - name: Build React app
        run: npm run build
        working-directory: ui-react
        env:
          VITE_API_DOTNET_URL: ${{ vars.PROD_API_DOTNET_URL }}
          VITE_UI_REACT_URL: ${{ vars.PROD_UI_REACT_URL }}
          VITE_UI_BLAZOR_URL: ${{ vars.PROD_UI_BLAZOR_URL }}
          VITE_MVC_DOTNET_URL: ${{ vars.PROD_MVC_DOTNET_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Run React tests
        run: npm test -- --run
        working-directory: ui-react
