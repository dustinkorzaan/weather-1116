name: build-and-test
run-name: Build and Test

on:
  push:
  workflow_dispatch:

# Newer pushes cancel older in-progress builds for the same ref.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - cqmediator-dotnet/cqmediator/CQMediator.csproj
          - core-dotnet/core/Core.csproj
          - api-dotnet/api/WeatherAPI.csproj
          - ui-blazor/blazor/WeatherBlazor.csproj
          - mvc-dotnet/mvc/WeatherMVC.csproj
          - worker-dotnet/worker/WeatherWorkerDotNet.csproj
          - mcp-srv-func-app/mcp/WeatherMcpSrvFuncApp.csproj
          - mcp-srv-app-service/mcp/WeatherMcpSrvAppService.csproj
          - FoundryConsoleV1/FoundryConsoleV1ModelDirectLegacy.csproj
          - FoundryConsoleV2/FoundryConsoleV2ModelDirectUnifiedAI.csproj
          - FoundryConsoleV3/FoundryConsoleV3InProcessToolCallbacks.csproj
          - FoundryConsoleV4/FoundryConsoleV4MCP.csproj
          - FoundryConsoleV5/FoundryConsoleV5Agent.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

  test-cqmediator:
    name: Test CQMediator Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run CQMediator tests
        run: dotnet test cqmediator-dotnet/cqmediator.tests/CQMediator.Tests.csproj --configuration Release --verbosity normal

  test-weather-api:
    name: Test Weather API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Weather API tests
        run: dotnet test api-dotnet/api.tests/WeatherAPI.Tests.csproj --configuration Release --verbosity normal

  test-core:
    name: Test Core Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Core tests
        run: dotnet test core-dotnet/core.tests/Core.Tests.csproj --configuration Release --verbosity normal

  test-worker:
    name: Test Worker DotNet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Worker DotNet tests
        run: dotnet test worker-dotnet/worker.tests/WeatherWorkerDotNet.Tests.csproj --configuration Release --verbosity normal

  test-blazor:
    name: Test Blazor UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Blazor tests
        run: dotnet test ui-blazor/blazor.tests/WeatherBlazor.Tests.csproj --configuration Release --verbosity normal

  test-mvc:
    name: Test MVC UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run MVC tests
        run: dotnet test mvc-dotnet/mvc.tests/WeatherMVC.Tests.csproj --configuration Release --verbosity normal

  test-mcp-srv-app-service:
    name: Test MCP Server on App Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run MCP Server on App Service tests
        run: dotnet test mcp-srv-app-service/mcp.tests/WeatherMcpSrvAppService.Tests.csproj --configuration Release --verbosity normal

  test-mcp-srv-func-app:
    name: Test MCP Server on Function App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run MCP Server on Function App tests
        run: dotnet test mcp-srv-func-app/mcp.tests/WeatherMcpSrvFuncApp.Tests.csproj --configuration Release --verbosity normal

  bicep-validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bicep CLI
        run: |
          curl -sSL -o "$RUNNER_TEMP/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bicep"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          bicep --version

      - name: Build every Bicep file (fails on any error or lint warning)
        run: |
          set -e
          for f in $(find infra -name '*.bicep' | sort); do
            echo "::group::bicep build $f"
            bicep build "$f" --stdout > /dev/null
            echo "::endgroup::"
          done

      - name: Validate main.parameters.json is well-formed
        run: jq empty infra/main.parameters.json

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: api-dotnet/api/Dockerfile
          - dockerfile: mvc-dotnet/mvc/Dockerfile
          - dockerfile: ui-blazor/blazor/Dockerfile
          - dockerfile: worker-dotnet/worker/Dockerfile
          - dockerfile: mcp-srv-app-service/mcp/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -f "${{ matrix.dockerfile }}" .

  build-and-test-react:
    name: Build and Test React Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-react

      - name: Build React app
        run: npm run build
        working-directory: ui-react
        env:
          VITE_API_DOTNET_URL: ${{ vars.PROD_API_DOTNET_URL }}
          VITE_UI_REACT_URL: ${{ vars.PROD_UI_REACT_URL }}
          VITE_UI_BLAZOR_URL: ${{ vars.PROD_UI_BLAZOR_URL }}
          VITE_MVC_DOTNET_URL: ${{ vars.PROD_MVC_DOTNET_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Run React tests
        run: npm test -- --run
        working-directory: ui-react

  # Single check name for GitHub branch rules on main (require "wx-1116-build-and-test-success").
  # needs.build covers every matrix cell of "Build All Projects".
  wx-1116-build-and-test-success:
    name: wx-1116-build-and-test-success
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - build
      - test-cqmediator
      - test-weather-api
      - test-core
      - test-worker
      - test-blazor
      - test-mvc
      - test-mcp-srv-app-service
      - test-mcp-srv-func-app
      - docker-build
      - build-and-test-react
      - bicep-validate
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more jobs did not succeed"
            exit 1
          fi
          echo "All jobs succeeded"
