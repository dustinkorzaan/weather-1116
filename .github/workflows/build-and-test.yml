name: Build and Test
run-name: Build and Test

on:
  # pull_request:
  #   branches:
  #     - main
  push:
      
permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - core-dotnet/Core.csproj
          - api-dotnet/WeatherAPI/WeatherAPI.csproj
          - ui-blazor/WeatherBlazor/WeatherBlazor.csproj
          - mvc-dotnet/WeatherMVC/WeatherMVC.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

  build-and-test-react:
    name: Build and Test React Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-react

      - name: Build React app
        run: npm run build
        working-directory: ui-react
        env:
          VITE_WEATHER1116_API_URL: ${{ secrets.PROD_WEATHER1116_API_URL }}

      - name: Run React tests
        run: npm test -- --run
        working-directory: ui-react
