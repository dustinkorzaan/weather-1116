name: build-and-test
run-name: Build and Test

on:
  push:

# Newer pushes cancel older in-progress builds for the same ref.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - core-dotnet/core/Core.csproj
          - api-dotnet/api/WeatherAPI.csproj
          - ui-blazor/blazor/WeatherBlazor.csproj
          - mvc-dotnet/mvc/WeatherMVC.csproj
          - worker-dotnet/worker/WeatherWorkerDotNet.csproj
          - mcp-function/mcp/WeatherMcpFunction.csproj
          - mcp-dotnet/mcp/WeatherMcpDotNet.csproj
          - FoundryConsoleV1/FoundryConsoleV1ModelDirectLegacy.csproj
          - FoundryConsoleV2/FoundryConsoleV2ModelDirectUnifiedAI.csproj
          - FoundryConsoleV3/FoundryConsoleV3InjectFunctions.csproj
          - FoundryConsoleV4/FoundryConsoleV4MCP.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

  test-weather-api:
    name: Test Weather API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Weather API tests
        run: dotnet test api-dotnet/api.tests/WeatherAPI.Tests.csproj --configuration Release --verbosity normal

  test-core:
    name: Test Core Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Core tests
        run: dotnet test core-dotnet/core.tests/Core.Tests.csproj --configuration Release --verbosity normal

  test-worker:
    name: Test Worker DotNet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Worker DotNet tests
        run: dotnet test worker-dotnet/worker.tests/WeatherWorkerDotNet.Tests.csproj --configuration Release --verbosity normal

  test-blazor:
    name: Test Blazor UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Blazor tests
        run: dotnet test ui-blazor/blazor.tests/WeatherBlazor.Tests.csproj --configuration Release --verbosity normal

  test-mvc:
    name: Test MVC UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run MVC tests
        run: dotnet test mvc-dotnet/mvc.tests/WeatherMVC.Tests.csproj --configuration Release --verbosity normal

  test-mcp-dotnet:
    name: Test MCP DotNet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run MCP DotNet tests
        run: dotnet test mcp-dotnet/mcp.tests/WeatherMcpDotNet.Tests.csproj --configuration Release --verbosity normal

  test-mcp-function:
    name: Test MCP Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run MCP Function tests
        run: dotnet test mcp-function/mcp.tests/WeatherMcpFunction.Tests.csproj --configuration Release --verbosity normal

  build-and-test-react:
    name: Build and Test React Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-react

      - name: Build React app
        run: npm run build
        working-directory: ui-react
        env:
          VITE_API_DOTNET_URL: ${{ vars.PROD_API_DOTNET_URL }}
          VITE_UI_REACT_URL: ${{ vars.PROD_UI_REACT_URL }}
          VITE_UI_BLAZOR_URL: ${{ vars.PROD_UI_BLAZOR_URL }}
          VITE_MVC_DOTNET_URL: ${{ vars.PROD_MVC_DOTNET_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Run React tests
        run: npm test -- --run
        working-directory: ui-react
