# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - weather1116-prod-api

on:
  push:
    # branches:
    #   - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./api-dotnet/WeatherAPI/WeatherAPI.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./api-dotnet/WeatherAPI/WeatherAPI.csproj -c Release -o "${{ github.workspace }}/publish/api-dotnet"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/api-dotnet

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/api-dotnet
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7BEAFC6B69684A48A530775AFA9F5CBC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_86E8A94708E04160B8D1CF64C93A8BBE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E26C433728B1426F96B897DD80B393F1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'weather1116-prod-api'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/api-dotnet
          