# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CICD weather1116-prod-api
run-name: CICD weather1116-prod-api

on:
  workflow_run:
    workflows:
      - Build Backend and Frontend
    # branches:
    #   - main
    types:
      - completed
  # Keep manual trigger for emergency redeploys and controlled production rollouts.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_START: ${{ github.run_started_at }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./api-dotnet/WeatherAPI/WeatherAPI.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./api-dotnet/WeatherAPI/WeatherAPI.csproj -c Release -o "${{ github.workspace }}/publish/api-dotnet"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/api-dotnet

  deploy:
    runs-on: windows-latest
    needs: build
    environment: prod
    env:
      WEATHER1116_UI_REACT_URL: ${{ secrets.PROD_WEATHER1116_UI_REACT }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/api-dotnet

      - name: Debug Azure OIDC secret lengths
        shell: bash
        env:
          AZURE_GITHUB_CLIENTID: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          AZURE_TENANTID: ${{ secrets.AZURE_TENANTID }}
          AZURE_SUBSCRIPTIONID: ${{ secrets.AZURE_SUBSCRIPTIONID }}
        run: |
          echo "AZURE_GITHUB_CLIENTID length=${#AZURE_GITHUB_CLIENTID}"
          echo "AZURE_TENANTID length=${#AZURE_TENANTID}"
          echo "AZURE_SUBSCRIPTIONID length=${#AZURE_SUBSCRIPTIONID}"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Set App Service settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_RG=$(az webapp list --query "[?name=='weather1116-prod-api'].resourceGroup | [0]" -o tsv)
            if [ -z "$APP_RG" ]; then
              echo "Could not resolve resource group for weather1116-prod-api" >&2
              exit 1
            fi

            az webapp config appsettings set \
              --name weather1116-prod-api \
              --resource-group "$APP_RG" \
              --settings Cors__AllowedOrigins__0="${{ env.WEATHER1116_UI_REACT_URL }}" ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_DETAILEDERRORS=false BUILD_NUMBER="${{ env.BUILD_NUMBER }}" BUILD_START="${{ env.BUILD_START }}"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'weather1116-prod-api'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/api-dotnet
          