# Provisions the wx1116-prod-* Azure resources (infra/main.bicep) via azd.
# Creates an App Service Plan + App Services + Function App + SQL + SWA +
# Foundry in wx1116-prod-rg (greenfield).
#
# Has no trigger of its own beyond workflow_dispatch -- it's called via
# workflow_call from build-test-provision-deploy.yml, which runs build-test.yml
# first and only calls this job (needs: [build_test]) once that succeeds on
# main, and runs unconditionally on every such push (rather than only when
# infra/** changed), which is intentional rather than a placeholder.
#
# The deploy workflows (prod-deploy-*.yml) are likewise called via
# workflow_call from build-test-provision-deploy.yml with needs: [provision],
# rather than triggering directly on push -- running them concurrently with
# this one caused "there is an active provisioning operation in progress"
# errors, since `azd provision`'s resource-group-scoped Bicep deployment and
# the deploy jobs' `az webapp/functionapp deploy` + `config appsettings set`
# calls both take ARM deployment locks in wx1116-prod-rg. workflow_dispatch
# still runs this (and each deploy workflow) unconditionally for manual runs
# on any branch.
#
# "Safe to re-run" is not free, though: a Bicep deployment is a PUT, so
# provision resets each App Service's application settings back to just the
# small set infra/modules/app-service.bicep and modules/function-app.bicep
# declare (App Insights connection string, AZURE_CLIENT_ID, and similar). The
# deploy workflows always re-run immediately afterward in the same pipeline
# (needs: [provision]) and re-add the rest via `az webapp/functionapp config
# appsettings set`, which only upserts the keys it's given, so the end state
# of every push to main is correct either way. Running prod-provision-infra
# on its own without a following deploy leaves settings at that reduced set
# until the next deploy runs.
#
# Reuses the existing AZURE_GITHUB_MI_CLIENTID / AZURE_TENANTID /
# AZURE_SUBSCRIPTIONID secrets -- AZURE_GITHUB_MI_CLIENTID holds
# wx1116-prod-github-actions-mi's client ID, on the assumption
# wx1116-prod-rg lives in the same tenant/subscription as the
# wx1116-prod-* deploys below.
#
# No SQL admin secret is needed at all: infra/modules/sql.bicep creates the
# server with Microsoft Entra-only authentication from the start, so no
# SQL-native login ever exists to have a secret for -- the
# administratorLogin/administratorLoginPassword ARM still requires are
# generated internally and never surfaced. infra/main.bicep registers
# wx1116-prod-github-actions-mi itself as the SQL server's Entra admin (its
# principal ID is already known from modules/managed-identity.bicep) -- but
# this workflow does NOT run
# infra/scripts/create-contained-users.sql itself. That's a deliberate
# manual step, run once by hand (as the Entra admin, e.g. via
# `az account get-access-token` + `Invoke-Sqlcmd -AccessToken`) rather than
# automated here -- a SQL-native login cannot run it (Azure SQL only allows
# CREATE USER ... FROM EXTERNAL PROVIDER over an Entra-authenticated
# connection), which is exactly why the Entra admin registration exists,
# but that doesn't require this workflow to be the one invoking it.
#
# The "prod" GitHub Environment gate below is required, not stylistic: the
# federated credential on wx1116-prod-github-actions-mi is scoped to the
# subject repo:dustinkorzaan/weather-1116:environment:prod, so azd auth
# login fails without it.

name: provision-wx1116-prod-infra
run-name: Provision wx1116-prod infra

on:
  workflow_call:
  workflow_dispatch:

# No cancel-in-progress: it only kills the runner, not the ARM deployment
# `azd provision` already submitted, so a cancelled-then-retriggered run
# collides with its own still-active deployment ("cannot be saved, because
# this would overwrite an existing deployment which is still active") on
# the fixed nested deployment names (e.g. "static-web-app") in
# infra/main.bicep. Queuing instead is free: azd provision already blocks
# until its deployment reaches a terminal state, so a queued run never
# starts while the previous one's ARM deployment is still live.
concurrency:
  group: prod-provision-infra

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_MI_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Log in with azd (federated credentials)
        shell: bash
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_GITHUB_MI_CLIENTID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANTID }}

      - name: Create or select azd environment
        shell: bash
        run: |
          azd env select "$AZURE_ENV_NAME" 2>/dev/null || \
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt
        env:
          AZURE_ENV_NAME: prod
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTIONID }}
          AZURE_LOCATION: centralus

      # infra/main.bicep is resource-group-scoped, not subscription-scoped
      # (deliberately -- wx1116-prod-github-actions-mi only holds Contributor
      # + User Access Administrator on wx1116-prod-rg, not the subscription).
      # azd needs to be told which pre-existing resource group to target;
      # without this it defaults to (and tries to create) rg-prod.
      - name: Point azd at the pre-existing resource group
        shell: bash
        run: azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
        env:
          AZURE_RESOURCE_GROUP: wx1116-prod-rg

      - name: Set required azd parameter values
        shell: bash
        run: |
          azd env set MCP_SRV_APP_SERVICE_KEY "$MCP_SRV_APP_SERVICE_KEY"
          azd env set MCP_SRV_FUNC_APP_KEY "$MCP_SRV_FUNC_APP_KEY"
        env:
          # Reuses the same MCP tool-host secrets the deploy workflows already
          # set as App Service/Function App settings -- so the MyMcpSrvAppService /
          # MyMcpSrvFuncApp Foundry RemoteTool connections
          # (infra/modules/ai-foundry.bicep) stay in sync with the actual host
          # credentials on every push to main, with no new secret to manage.
          MCP_SRV_APP_SERVICE_KEY: ${{ secrets.PROD_MCP_SRV_APP_SERVICE_KEY }}
          MCP_SRV_FUNC_APP_KEY: ${{ secrets.PROD_MCP_SRV_FUNC_APP_KEY }}

      - name: azd provision
        shell: bash
        run: azd provision --no-prompt

      # infra/scripts/create-contained-users.sql is deliberately NOT run
      # here -- run it manually, once, as the Entra admin
      # (wx1116-prod-github-actions-mi or another Entra admin on the
      # server), e.g.:
      #   az login
      #   $accessToken = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
      #   Invoke-Sqlcmd -ServerInstance wx1116-prod-sql-srv.database.windows.net -Database wx1116-prod-sql-database -AccessToken $accessToken -InputFile infra/scripts/create-contained-users.sql
