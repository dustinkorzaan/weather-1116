# Docs for Azure Functions deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CICD weather1116-prod-mcpfunc
run-name: CICD weather1116-prod-mcpfunc

on:
  workflow_run:
    workflows:
      - Build and Test
    branches:
      - main
    types:
      - completed
  # Keep manual trigger for emergency redeploys and controlled production rollouts.
  workflow_dispatch:

# Newer deploys cancel older in-progress runs of this workflow.
concurrency:
  group: prod-deploy-mcpfunc
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_VERSION: '10.x'
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: read #This is required for actions/checkout
    outputs:
      build_start: ${{ steps.build_start.outputs.build_start }}

    steps:
      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build with dotnet
        run: dotnet build ./mcp-function/WeatherMcpFunction.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./mcp-function/WeatherMcpFunction.csproj -c Release -o "${{ github.workspace }}/publish/mcp-function"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mcp-function

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    env:
      BUILD_START: ${{ needs.build.outputs.build_start }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mcp-function

      - name: Debug Azure OIDC secret lengths
        shell: bash
        env:
          AZURE_GITHUB_CLIENTID: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          AZURE_TENANTID: ${{ secrets.AZURE_TENANTID }}
          AZURE_SUBSCRIPTIONID: ${{ secrets.AZURE_SUBSCRIPTIONID }}
        run: |
          echo "AZURE_GITHUB_CLIENTID length=${#AZURE_GITHUB_CLIENTID}"
          echo "AZURE_TENANTID length=${#AZURE_TENANTID}"
          echo "AZURE_SUBSCRIPTIONID length=${#AZURE_SUBSCRIPTIONID}"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Set Function App settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_RG=$(az functionapp list --query "[?name=='weather1116-prod-mcpfunc'].resourceGroup | [0]" -o tsv)
            if [ -z "$APP_RG" ]; then
              echo "Could not resolve resource group for weather1116-prod-mcpfunc" >&2
              exit 1
            fi

            az functionapp config appsettings set \
              --name weather1116-prod-mcpfunc \
              --resource-group "$APP_RG" \
              --settings ASPNETCORE_ENVIRONMENT=Production BUILD_NUMBER="${{ env.BUILD_NUMBER }}" BUILD_START="${{ env.BUILD_START }}"

      - name: Deploy to Azure Function App
        id: deploy-to-functionapp
        uses: Azure/functions-action@v1
        with:
          app-name: 'weather1116-prod-mcpfunc'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/mcp-function
          