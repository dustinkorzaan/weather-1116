name: Build Backend and Frontend
run-name: Build Backend and Frontend

on:
  pull_request:
    branches:
      - main
  push:
      
permissions:
  contents: read

jobs:
  build:
    name: Build All Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - core-dotnet/Core.csproj
          - api-dotnet/WeatherAPI/WeatherAPI.csproj
          - ui-blazor/WeatherBlazor/WeatherBlazor.csproj
          - mvc-dotnet/WeatherMVC/WeatherMVC.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

  build-react:
    name: Build React Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-react

      - name: Build React app
        run: npm run build
        working-directory: ui-react