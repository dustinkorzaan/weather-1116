name: cicd-weather1116-prod-react
run-name: CICD weather1116-prod-react

on:
  workflow_run:
    workflows:
      - build-and-test
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: prod-deploy-react
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      actions: read #This is required for waiting on provision-wx1116-prod-infra
    steps:
      # Fail (do not skip) when build-and-test failed: an all-skipped workflow
      # run reports conclusion success, which would unblock prod deploys.
      - name: Require build-and-test success
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "build-and-test conclusion was ${{ github.event.workflow_run.conclusion }}; refusing to deploy." >&2
            exit 1
          fi

      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2
          submodules: true
          lfs: false

      - name: Wait for provision when infra changed
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git diff --name-only HEAD^ HEAD -- infra/ azure.yaml | grep -q .; then
            echo "No infra changes; provision not required."
            exit 0
          fi

          echo "Infra changes detected; waiting for provision-wx1116-prod-infra on ${COMMIT_SHA}..."
          for attempt in $(seq 1 60); do
            read -r status conclusion < <(gh run list \
              --workflow=prod-provision-infra.yml \
              --commit="${COMMIT_SHA}" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion // "null")"')

            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "Provision succeeded."
                exit 0
              fi
              echo "Provision concluded with: ${conclusion}" >&2
              exit 1
            fi

            echo "Attempt ${attempt}/60: provision status=${status}; sleeping 30s..."
            sleep 30
          done

          echo "Timed out waiting for provision-wx1116-prod-infra" >&2
          exit 1

      - name: Debug AZURE_UI_REACT_TOKEN length
        shell: bash
        env:
          AZURE_UI_REACT_TOKEN: ${{ secrets.AZURE_UI_REACT_TOKEN }}
        run: echo "AZURE_UI_REACT_TOKEN length=${#AZURE_UI_REACT_TOKEN}"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_DOTNET_URL: ${{ vars.PROD_API_DOTNET_URL }}
          VITE_UI_REACT_URL: ${{ vars.PROD_UI_REACT_URL }}
          VITE_UI_BLAZOR_URL: ${{ vars.PROD_UI_BLAZOR_URL }}
          VITE_MVC_DOTNET_URL: ${{ vars.PROD_MVC_DOTNET_URL }}
          VITE_WORKER_DOTNET_URL: ${{ vars.PROD_WORKER_DOTNET_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          VITE_BUILD_START: ${{ steps.build_start.outputs.build_start }}
          VITE_BUILD_BRANCH_NAME: ${{ env.BUILD_BRANCH_NAME }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_UI_REACT_TOKEN }}
          # repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./ui-react" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
