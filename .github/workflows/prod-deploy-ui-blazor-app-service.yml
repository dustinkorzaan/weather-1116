# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CICD weather1116-prod-blazor
run-name: CICD weather1116-prod-blazor

on:
  workflow_run:
    workflows:
      - Build Backend and Frontend
    # branches:
    #   - main
    types:
      - completed
  # Keep manual trigger for emergency redeploys and controlled production rollouts.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./ui-blazor/WeatherBlazor/WeatherBlazor.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./ui-blazor/WeatherBlazor/WeatherBlazor.csproj -c Release -o "${{ github.workspace }}/publish/ui-blazor"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/ui-blazor

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/ui-blazor
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE8EF0CEB8FE466EA39CDAA861CB718C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0365F095712A48C984AB2679D6BB868D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5E4463D216B147929BF144A2ECB45A8B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'weather1116-prod-blazor'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/ui-blazor
          