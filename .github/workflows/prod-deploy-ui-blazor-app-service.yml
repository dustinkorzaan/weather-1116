name: cicd-wx1116-prod-blazor
run-name: CICD wx1116-prod-blazor

on:
  workflow_run:
    workflows:
      - build-and-test
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: prod-deploy-blazor
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
      actions: read #This is required for waiting on provision-wx1116-prod-infra
    outputs:
      build_start: ${{ steps.build_start.outputs.build_start }}

    steps:
      # Fail (do not skip) when build-and-test failed: an all-skipped workflow
      # run reports conclusion success, which would unblock prod deploys.
      - name: Require build-and-test success
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "build-and-test conclusion was ${{ github.event.workflow_run.conclusion }}; refusing to deploy." >&2
            exit 1
          fi

      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Wait for provision when infra changed
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git diff --name-only HEAD^ HEAD -- infra/ azure.yaml | grep -q .; then
            echo "No infra changes; provision not required."
            exit 0
          fi

          echo "Infra changes detected; waiting for provision-wx1116-prod-infra on ${COMMIT_SHA}..."
          for attempt in $(seq 1 60); do
            read -r status conclusion < <(gh run list \
              --workflow=prod-provision-infra.yml \
              --commit="${COMMIT_SHA}" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion // "null")"')

            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "Provision succeeded."
                exit 0
              fi
              echo "Provision concluded with: ${conclusion}" >&2
              exit 1
            fi

            echo "Attempt ${attempt}/60: provision status=${status}; sleeping 30s..."
            sleep 30
          done

          echo "Timed out waiting for provision-wx1116-prod-infra" >&2
          exit 1

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./ui-blazor/blazor/WeatherBlazor.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./ui-blazor/blazor/WeatherBlazor.csproj -c Release -o "${{ github.workspace }}/publish/ui-blazor"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/ui-blazor

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    env:
      API_DOTNET_URL: ${{ vars.PROD_API_DOTNET_URL }}
      UI_REACT_URL: ${{ vars.PROD_UI_REACT_URL }}
      UI_BLAZOR_URL: ${{ vars.PROD_UI_BLAZOR_URL }}
      MVC_DOTNET_URL: ${{ vars.PROD_MVC_DOTNET_URL }}
      WORKER_DOTNET_URL: ${{ vars.PROD_WORKER_DOTNET_URL }}
      BUILD_START: ${{ needs.build.outputs.build_start }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/ui-blazor

      - name: Debug Azure OIDC secret lengths
        shell: bash
        env:
          AZURE_GITHUB_CLIENTID: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          AZURE_TENANTID: ${{ secrets.AZURE_TENANTID }}
          AZURE_SUBSCRIPTIONID: ${{ secrets.AZURE_SUBSCRIPTIONID }}
        run: |
          echo "AZURE_GITHUB_CLIENTID length=${#AZURE_GITHUB_CLIENTID}"
          echo "AZURE_TENANTID length=${#AZURE_TENANTID}"
          echo "AZURE_SUBSCRIPTIONID length=${#AZURE_SUBSCRIPTIONID}"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Set App Service settings
        uses: azure/cli@v3
        with:
          inlineScript: |
            APP_RG=$(az webapp list --query "[?name=='wx1116-prod-blazor'].resourceGroup | [0]" -o tsv)
            if [ -z "$APP_RG" ]; then
              echo "Could not resolve resource group for wx1116-prod-blazor" >&2
              exit 1
            fi

            # Blazor Server needs WebSockets enabled (default is Off on App Service).
            az webapp config set \
              --name wx1116-prod-blazor \
              --resource-group "$APP_RG" \
              --web-sockets-enabled true

            az webapp config appsettings set \
              --name wx1116-prod-blazor \
              --resource-group "$APP_RG" \
              --settings API_DOTNET_URL="${{ env.API_DOTNET_URL }}" UI_REACT_URL="${{ env.UI_REACT_URL }}" UI_BLAZOR_URL="${{ env.UI_BLAZOR_URL }}" MVC_URL="${{ env.MVC_DOTNET_URL }}" WORKER_DOTNET_URL="${{ env.WORKER_DOTNET_URL }}" GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_DETAILEDERRORS=false BUILD_NUMBER="${{ env.BUILD_NUMBER }}" BUILD_START="${{ env.BUILD_START }}" BUILD_BRANCH_NAME="${{ env.BUILD_BRANCH_NAME }}"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wx1116-prod-blazor'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/ui-blazor
          