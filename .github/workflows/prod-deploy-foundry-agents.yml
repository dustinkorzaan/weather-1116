# Publishes the two hosted Foundry agents (wx1116-agent-current-weather for V5,
# wx1116-agent-chat for Chat3) via .github/scripts/deploy-foundry-agent.sh.
#
# Runs automatically once provision-wx1116-prod-infra finishes successfully
# on main, same as the other prod-deploy-*.yml workflows - infra/main.bicep
# provisions the gpt-5.4-mini model deployment and the two MCP tool
# connections (MyMcpSrvAppService, MyMcpSrvFuncApp) idempotently on every
# push, but Foundry has no ARM resource for agents, so this workflow
# publishes/updates them separately against the same provisioned project.
# workflow_dispatch still works for manual runs on any branch.
#
# The create/update contract this script uses is a best-effort match to the
# Assistants-compatible API - it was written without being able to verify it
# against current Microsoft docs from the authoring session. Watch this
# workflow's runs, and confirm in the Foundry portal (Agents -> <name> ->
# Versions) that a new version actually published.
#
# System prompts live in .github/foundry-agents/*.instructions.md - edit
# those files and push (or re-run this workflow) to publish an update.
#
# The Agents API requires Entra ID auth, not the account api-key used
# elsewhere -- see deploy-foundry-agent.sh for why. This workflow logs in
# as the GitHub Actions identity (granted "Foundry User" at project scope
# by infra/modules/ai-foundry.bicep) and mints a token scoped to
# https://ai.azure.com/.default for the script to send as a bearer token.
#
# Reuses existing repo secrets/vars (no new ones needed):
#   AZURE_GITHUB_CLIENTID / AZURE_TENANTID / AZURE_SUBSCRIPTIONID
#   AZURE_FOUNDRY_PROD_EUS2_PROJ_URL / AZURE_FOUNDRY_PROD_EUS2_MODEL
#   PROD_MCP_SRV_APP_SERVICE_URL / PROD_MCP_SRV_APP_SERVICE_KEY
#   PROD_MCP_SRV_FUNC_APP_URL / PROD_MCP_SRV_FUNC_APP_KEY

name: prod-deploy-foundry-agents
run-name: Deploy wx1116-prod Foundry agents

on:
  workflow_run:
    workflows: ["provision-wx1116-prod-infra"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: prod-deploy-foundry-agents
  cancel-in-progress: true

jobs:
  deploy:
    # Only publish once provision-wx1116-prod-infra has finished successfully
    # on main -- agents reference the model deployment, MCP connections, and
    # the GitHub Actions identity's Foundry User role assignment infra
    # provisions, so they must run after it, not concurrently with it.
    # workflow_dispatch still runs unconditionally for manual publishes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Get Foundry access token
        id: foundry_token
        shell: bash
        run: |
          token=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish wx1116-agent-current-weather (V5 current-ai-weather)
        shell: bash
        env:
          AZURE_FOUNDRY_PROD_EUS2_PROJ_URL: ${{ vars.AZURE_FOUNDRY_PROD_EUS2_PROJ_URL }}
          AZURE_FOUNDRY_ACCESS_TOKEN: ${{ steps.foundry_token.outputs.token }}
          AZURE_FOUNDRY_PROD_EUS2_MODEL: ${{ vars.AZURE_FOUNDRY_PROD_EUS2_MODEL }}
          MCP_SRV_APP_SERVICE_URL: ${{ vars.PROD_MCP_SRV_APP_SERVICE_URL }}
          MCP_SRV_APP_SERVICE_KEY: ${{ secrets.PROD_MCP_SRV_APP_SERVICE_KEY }}
          MCP_SRV_FUNC_APP_URL: ${{ vars.PROD_MCP_SRV_FUNC_APP_URL }}
          MCP_SRV_FUNC_APP_KEY: ${{ secrets.PROD_MCP_SRV_FUNC_APP_KEY }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/deploy-foundry-agent.sh" \
            wx1116-agent-current-weather \
            "${GITHUB_WORKSPACE}/.github/foundry-agents/wx1116-agent-current-weather.instructions.md" \
            --response-schema "${GITHUB_WORKSPACE}/.github/foundry-agents/wx1116-agent-current-weather.response-schema.json"

      - name: Publish wx1116-agent-chat (Chat3)
        shell: bash
        env:
          AZURE_FOUNDRY_PROD_EUS2_PROJ_URL: ${{ vars.AZURE_FOUNDRY_PROD_EUS2_PROJ_URL }}
          AZURE_FOUNDRY_ACCESS_TOKEN: ${{ steps.foundry_token.outputs.token }}
          AZURE_FOUNDRY_PROD_EUS2_MODEL: ${{ vars.AZURE_FOUNDRY_PROD_EUS2_MODEL }}
          MCP_SRV_APP_SERVICE_URL: ${{ vars.PROD_MCP_SRV_APP_SERVICE_URL }}
          MCP_SRV_APP_SERVICE_KEY: ${{ secrets.PROD_MCP_SRV_APP_SERVICE_KEY }}
          MCP_SRV_FUNC_APP_URL: ${{ vars.PROD_MCP_SRV_FUNC_APP_URL }}
          MCP_SRV_FUNC_APP_KEY: ${{ secrets.PROD_MCP_SRV_FUNC_APP_KEY }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/deploy-foundry-agent.sh" \
            wx1116-agent-chat \
            "${GITHUB_WORKSPACE}/.github/foundry-agents/wx1116-agent-chat.instructions.md"
