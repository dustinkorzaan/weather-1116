# Publishes the shared geo + NonAI Weather toolbox and the two hosted Foundry agents
# (wx1116-agent-for-current-weather for V5, wx1116-agent-for-chat for Chat3).
#
# Called via workflow_call from build-test-provision-deploy.yml with
# needs: [provision], same as the other prod-deploy-*.yml workflows.
# infra/main.bicep provisions the gpt-5.4-mini model deployment and the four
# MCP RemoteTool connections (MyMcpSrvAppService, MyMcpSrvFuncApp, MyMcpSrvPython, MyMcpSrvNode)
# idempotently on every push. deploy-foundry-toolbox.sh wraps those connections
# in a toolbox; deploy-foundry-agent.sh attaches the toolbox to each agent
# (require_approval: never). workflow_dispatch still works for manual runs.
#
# System prompts live in .github/foundry-agents/*.instructions.md - edit
# those files and push (or re-run this workflow) to publish an update.
#
# The Agents API requires Entra ID auth, not the account api-key used
# elsewhere -- see deploy-foundry-agent.sh for why. This workflow logs in
# as the GitHub Actions identity (granted "Foundry User" at project scope
# by infra/modules/ai-foundry.bicep) and mints a token scoped to
# https://ai.azure.com/.default for the script to send as a bearer token.
#
# Reuses existing OIDC secrets, plus these Foundry/URL vars (see
# docs/aca-bootstrap.md Step 2):
#   AZURE_GITHUB_MI_CLIENTID / AZURE_TENANTID / AZURE_SUBSCRIPTIONID
#   AZURE_FOUNDRY_PROD_PROJ_URL / AZURE_FOUNDRY_PROD_MODEL
#   AZURE_FOUNDRY_ARM_ACCOUNT_NAME (ARM resource name, e.g. wx1116-prod-res)
#   PROD_MCP_SRV_APP_SERVICE_URL / PROD_MCP_SRV_FUNC_APP_URL / PROD_MCP_SRV_PYTHON_URL /
#   PROD_MCP_SRV_NODE_URL
#     (URL fallback only; MCP keys stay on the Foundry connections)

name: prod-deploy-foundry-agents
run-name: Deploy wx1116-prod Foundry agents

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: prod-deploy-foundry-agents
  cancel-in-progress: true

jobs:
  deploy:
    # Called via workflow_call from build-test-provision-deploy.yml with
    # needs: [provision] -- agents reference the model deployment, MCP
    # connections, and the GitHub Actions identity's Foundry User role
    # assignment infra provisions, so they must run after it, not
    # concurrently with it. workflow_dispatch still runs unconditionally for
    # manual publishes.
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_MI_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Get Foundry access token
        id: foundry_token
        shell: bash
        run: |
          token=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish wx1116-geo-nonaiweather-toolbox
        shell: bash
        env:
          AZURE_FOUNDRY_PROD_PROJ_URL: ${{ vars.AZURE_FOUNDRY_PROD_PROJ_URL }}
          AZURE_FOUNDRY_ACCESS_TOKEN: ${{ steps.foundry_token.outputs.token }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTIONID }}
          AZURE_RESOURCE_GROUP: wx1116-prod-rg
          AZURE_FOUNDRY_ARM_ACCOUNT_NAME: ${{ vars.AZURE_FOUNDRY_ARM_ACCOUNT_NAME }}
          MCP_SRV_APP_SERVICE_URL: ${{ vars.PROD_MCP_SRV_APP_SERVICE_URL }}
          MCP_SRV_FUNC_APP_URL: ${{ vars.PROD_MCP_SRV_FUNC_APP_URL }}
          MCP_SRV_PYTHON_URL: ${{ vars.PROD_MCP_SRV_PYTHON_URL }}
          MCP_SRV_NODE_URL: ${{ vars.PROD_MCP_SRV_NODE_URL }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/deploy-foundry-toolbox.sh"

      - name: Publish wx1116-agent-for-current-weather (V5 current-ai-weather)
        shell: bash
        env:
          AZURE_FOUNDRY_PROD_PROJ_URL: ${{ vars.AZURE_FOUNDRY_PROD_PROJ_URL }}
          AZURE_FOUNDRY_ACCESS_TOKEN: ${{ steps.foundry_token.outputs.token }}
          AZURE_FOUNDRY_PROD_MODEL: ${{ vars.AZURE_FOUNDRY_PROD_MODEL }}
          MCP_SRV_APP_SERVICE_URL: ${{ vars.PROD_MCP_SRV_APP_SERVICE_URL }}
          MCP_SRV_FUNC_APP_URL: ${{ vars.PROD_MCP_SRV_FUNC_APP_URL }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/deploy-foundry-agent.sh" \
            wx1116-agent-for-current-weather \
            "${GITHUB_WORKSPACE}/.github/foundry-agents/wx1116-agent-for-current-weather.instructions.md" \
            --response-schema "${GITHUB_WORKSPACE}/.github/foundry-agents/wx1116-agent-for-current-weather.response-schema.json"

      - name: Publish wx1116-agent-for-chat (Chat3)
        shell: bash
        env:
          AZURE_FOUNDRY_PROD_PROJ_URL: ${{ vars.AZURE_FOUNDRY_PROD_PROJ_URL }}
          AZURE_FOUNDRY_ACCESS_TOKEN: ${{ steps.foundry_token.outputs.token }}
          AZURE_FOUNDRY_PROD_MODEL: ${{ vars.AZURE_FOUNDRY_PROD_MODEL }}
          MCP_SRV_APP_SERVICE_URL: ${{ vars.PROD_MCP_SRV_APP_SERVICE_URL }}
          MCP_SRV_FUNC_APP_URL: ${{ vars.PROD_MCP_SRV_FUNC_APP_URL }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/deploy-foundry-agent.sh" \
            wx1116-agent-for-chat \
            "${GITHUB_WORKSPACE}/.github/foundry-agents/wx1116-agent-for-chat.instructions.md"
