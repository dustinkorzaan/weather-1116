name: cicd-wx1116-prod-mcp-srv-func-app
run-name: CICD wx1116-prod-mcp-srv-func-app (Functions on ACA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prod-deploy-mcp-srv-func
  cancel-in-progress: true

env:
  RESOURCE_GROUP: wx1116-prod-rg
  ACR_NAME: wx1116prodacr
  CONTAINER_APP_NAME: wx1116-prod-mcp-srv-func-app
  IMAGE_NAME: wx1116-mcp-func
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Build, push, and update Functions container app
        uses: ./.github/actions/deploy-aca-container
        with:
          acr_name: ${{ env.ACR_NAME }}
          image_name: ${{ env.IMAGE_NAME }}
          image_tag: ${{ github.run_number }}
          dockerfile: mcp-srv-func-app/mcp/Dockerfile
          container_app_name: ${{ env.CONTAINER_APP_NAME }}
          resource_group: ${{ env.RESOURCE_GROUP }}
          env_overlay_multiline: |
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_START=${{ steps.build_start.outputs.build_start }}
            BUILD_BRANCH_NAME=${{ env.BUILD_BRANCH_NAME }}

      - name: Ensure mcp_extension system key exists
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/aca-functions-mcp-key.sh" \
            "${{ env.CONTAINER_APP_NAME }}" \
            "${{ env.RESOURCE_GROUP }}"
