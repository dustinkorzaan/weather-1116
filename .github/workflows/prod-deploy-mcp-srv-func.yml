name: cicd-wx1116-prod-mcp-srv-func-app
run-name: CICD wx1116-prod-mcp-srv-func-app (Function App)

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: prod-deploy-mcp-srv-func
  cancel-in-progress: true

env:
  RESOURCE_GROUP: wx1116-prod-rg
  APP_NAME: wx1116-prod-mcp-srv-func-app
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.ref_name }}

jobs:
  deploy:
    # Called via workflow_call from build-test-provision-deploy.yml with
    # needs: [provision] -- deploys the Function App that infra provisions, so
    # it must run after it, not concurrently with it. workflow_dispatch still
    # runs unconditionally for manual deploys on any branch.
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_MI_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Publish and deploy to Function App
        uses: ./.github/actions/deploy-app-service
        with:
          app_kind: functionapp
          csproj: mcp-srv-func-app/mcp/WeatherMcpSrvFuncApp.csproj
          app_name: ${{ env.APP_NAME }}
          resource_group: ${{ env.RESOURCE_GROUP }}
          env_overlay_multiline: |
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            BUILD_START=${{ steps.build_start.outputs.build_start }}
            BUILD_BRANCH_NAME=${{ env.BUILD_BRANCH_NAME }}

      - name: Apply mcp_extension system key from GitHub secret
        shell: bash
        env:
          MCP_EXTENSION_KEY: ${{ secrets.PROD_MCP_SRV_FUNC_APP_KEY }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/function-app-mcp-key.sh" \
            "${{ env.APP_NAME }}" \
            "${{ env.RESOURCE_GROUP }}"
