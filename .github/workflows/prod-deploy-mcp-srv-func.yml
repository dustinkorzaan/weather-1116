name: cicd-wx1116-prod-mcp-srv-func-app
run-name: CICD wx1116-prod-mcp-srv-func-app (Functions on ACA)

on:
  workflow_run:
    workflows:
      - provision-wx1116-prod-infra
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: prod-deploy-mcp-srv-func-app
  cancel-in-progress: true

env:
  RESOURCE_GROUP: wx1116-prod-rg
  CONTAINER_APP_NAME: wx1116-prod-mcp-srv-func-app
  DOTNET_VERSION: '10.x'
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Require provision success
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "provision-wx1116-prod-infra conclusion was ${{ github.event.workflow_run.conclusion }}; refusing to deploy." >&2
            exit 1
          fi

      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build ./mcp-srv-func-app/mcp/WeatherMcpSrvFuncApp.csproj --configuration Release

      - name: Publish Functions package
        run: dotnet publish ./mcp-srv-func-app/mcp/WeatherMcpSrvFuncApp.csproj -c Release -o "${{ github.workspace }}/publish/mcp-srv-func-app"

      - name: Verify Functions package contents
        shell: bash
        run: |
          PACKAGE_DIR="${{ github.workspace }}/publish/mcp-srv-func-app"
          if [ ! -d "$PACKAGE_DIR/.azurefunctions" ]; then
            echo "Missing required .azurefunctions directory in publish package:" >&2
            ls -la "$PACKAGE_DIR" >&2
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Deploy to Functions on Container Apps
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.CONTAINER_APP_NAME }}
          package: ${{ github.workspace }}/publish/mcp-srv-func-app

      - name: Set build metadata on Functions container app
        uses: azure/cli@v3
        with:
          inlineScript: |
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                "AZURE_FUNCTIONS_ENVIRONMENT=Production" \
                "BUILD_NUMBER=${{ env.BUILD_NUMBER }}" \
                "BUILD_START=${{ steps.build_start.outputs.build_start }}" \
                "BUILD_BRANCH_NAME=${{ env.BUILD_BRANCH_NAME }}"

      - name: Ensure mcp_extension system key exists
        uses: azure/cli@v3
        with:
          inlineScript: |
            set -euo pipefail
            KEY_VALUE=$(az containerapp function keys list \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --key-type systemKey \
              --query "keys[?name=='mcp_extension'].value | [0]" -o tsv 2>/dev/null || true)

            if [ -z "$KEY_VALUE" ] || [ "$KEY_VALUE" = "None" ]; then
              KEY_VALUE=$(openssl rand -base64 32)
              az containerapp function keys set \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --key-type systemKey \
                --key-name mcp_extension \
                --key-value "$KEY_VALUE"
              echo "::notice::Created new mcp_extension system key. Update GitHub secret PROD_MCP_SRV_FUNC_APP_KEY if this is the first deploy."
            else
              echo "::notice::mcp_extension system key already present."
            fi
