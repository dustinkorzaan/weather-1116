name: Trello Card Moved to Ready For Github

on:
  repository_dispatch:
    types: [trello_card_moved] # Matches event_type from Trello Butler payload

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission to create a branch reference
    env:
      CARD_NUMBER: ${{ github.event.client_payload.card_number }}
      CARD_ID: ${{ github.event.client_payload.card_id }}
      CARD_NAME: ${{ github.event.client_payload.card_name }}
      CARD_DESCRIPTION: ${{ github.event.client_payload.card_description }}
      CARD_CHECKLISTS: ${{ toJson(github.event.client_payload.card_checklists) }}

    steps:
      - name: Prepare variables
        id: branch_info
        run: |
          # Cleans the Trello card name to make it web/git safe: lowercase and replace any non-alphanumeric with hyphens
          sanitize_name() {
            local sanitized
            sanitized=$(printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9]/-/g' |
              sed 's/-\+/-/g' |
              sed 's/^-//; s/-$//')
            printf '%s' "${sanitized:0:20}"
          }

          CLEAN_NAME=$(sanitize_name "$CARD_NAME")
          
          # Formats final branch as `trello-123-your-card-title`
          branch_name="trello-${CARD_NUMBER}-${CARD_ID}-${CLEAN_NAME}"
          echo "branch_name=${branch_name}" >> "$GITHUB_OUTPUT"
          echo "prompt<<EOF" >> "$GITHUB_OUTPUT"
          prompt_lines=(
            "You are working in the current branch: ${branch_name}"
            ""
            "Card number: ${CARD_NUMBER}"
            "Card ID: ${CARD_ID}"
            "Card name: ${CARD_NAME}"
            "Card description:"
            "${CARD_DESCRIPTION}"
            ""
            ""
            "Generate code in the current branch ${branch_name} based on the Card description."
            ""
            "Do not stage, commit, or push any changes unless explicitly instructed to do so."
            "Only modify the files in the current working tree."
          )
          printf '%s\n' "${prompt_lines[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          npm install -g @github/copilot

      - name: Create and Push Git Branch
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          echo "Pulling latest main..."
          git pull origin main
          echo "Checking branch: $BRANCH_NAME"
          
          # Check if branch exists on remote
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch exists, pulling and checking out..."
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
          else
            echo "Branch does not exist, creating..."
            git checkout -b "$BRANCH_NAME"
            git push --set-upstream origin "$BRANCH_NAME"
          fi
          
          echo "Rebasing $BRANCH_NAME onto main..."
          git rebase origin/main || echo "Rebase already up to date"

      - name: Run Copilot and Commit Changes
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }} # Authenticates the Copilot CLI
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          prompt='${{ steps.branch_info.outputs.prompt }}'

          echo "Prompt: $prompt"
          copilot -p "$prompt" --allow-all --silent
          echo "\n=== Git Status After Copilot ==="
          git status --short
          echo "\n=== Git Diff Summary After Copilot ==="
          git diff --stat
          
          # Stage, commit, and push any generated changes
          echo "\n=== Committing Changes ==="
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config user.email "dustin@korzaan.com"
            git config user.name "Dustin Korzaan"
            git add -A
            git commit -m "Apply Copilot generated changes"
            git push origin "$BRANCH_NAME"
            echo "Changes committed and pushed to $BRANCH_NAME"
          fi

