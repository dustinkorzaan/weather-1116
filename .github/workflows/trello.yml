name: Trello Card Moved to Ready For Github

on:
  repository_dispatch:
    types: [trello_card_moved] # Matches event_type from Trello Butler payload

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission to create a branch reference
    env:
      CARD_NUMBER: ${{ github.event.client_payload.card_number }}
      CARD_ID: ${{ github.event.client_payload.card_id }}
      CARD_NAME: ${{ github.event.client_payload.card_name }}
      CARD_DESCRIPTION: ${{ github.event.client_payload.card_description }}
      CARD_CHECKLISTS: ${{ toJson(github.event.client_payload.card_checklists) }}

    steps:
      - name: Prepare variables
        id: branch_info
        run: |
          # Clean name to make it simple and web/git safe:
          # - lowercase
          # - non-alphanumeric as hyphens
          # - collapse multiple hyphens
          # - trim leading/trailing hyphens
          # - limit to 50 characters
          sanitize_name() {
            local sanitized
            sanitized=$(printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9]/-/g' |
              sed 's/-\+/-/g' |
              sed 's/^-//; s/-$//')
            printf '%s' "${sanitized:0:50}"
          }

          # Formats final branch as `trello-123-your-story-name`
          branch_name="trello-${CARD_NUMBER}-${CARD_NAME}"
          branch_name=$(sanitize_name "$branch_name")
          echo "branch_name=${branch_name}" >> "$GITHUB_OUTPUT"

          # PR Name is the same as branch name but with hyphens replaced by spaces
          pr_name="${branch_name//-/ }"
          echo "pr_name=${pr_name}" >> "$GITHUB_OUTPUT"
          
          echo "prompt<<EOF" >> "$GITHUB_OUTPUT"
          prompt_lines=(
            "You are working in the current branch: ${branch_name}"
            ""
            "Card number: ${CARD_NUMBER}"
            "Card ID: ${CARD_ID}"
            "Card name: ${CARD_NAME}"
            ""
            "Card description:"
            "<<<CARD_DESCRIPTION_START>>>"
            "${CARD_DESCRIPTION}"
            "<<<CARD_DESCRIPTION_END>>>"
            ""
            "Card checklists:"
            "<<<CARD_CHECKLISTS_START>>>"
            "${CARD_CHECKLISTS}"
            "<<<CARD_CHECKLISTS_END>>>"
            ""
            "Generate code in the current branch ${branch_name} based on the Card description."
            ""
            "Do not stage, commit, or push any changes unless explicitly instructed to do so."
            "Only modify the files in the current working tree."
          )
          printf '%s\n' "${prompt_lines[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          npm install -g @github/copilot

      - name: Fail If Branch Already Exists
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          echo "Checking if branch $BRANCH_NAME already exists on remote..."
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists on remote. Failing."
            exit 1
          fi
          echo "Branch $BRANCH_NAME does not exist on remote."

      - name: Create and Push Git Branch
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          echo "Pulling latest main..."
          git fetch origin main
          git checkout main
          git pull origin main
          echo "Creating branch: $BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
          
          # Create an empty commit using the prepared PR name so the PR step can create a pull request
          PR_NAME="${{ steps.branch_info.outputs.pr_name }}"
          git commit --allow-empty -m "$PR_NAME"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          PR_NAME="${{ steps.branch_info.outputs.pr_name }}"
          REPO_FULL="${GITHUB_REPOSITORY}"
          API_URL="https://api.github.com/repos/${REPO_FULL}/pulls"
          PAYLOAD=$(printf '{"title":"%s","head":"%s","base":"main","body":"Automated PR created from Trello workflow"}' "${PR_NAME}" "${BRANCH_NAME}")
          echo "Creating PR: ${PR_NAME} (${BRANCH_NAME})"
          resp=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -d "${PAYLOAD}" "${API_URL}")
          if [ "$resp" -ge 200 ] && [ "$resp" -lt 300 ]; then
            echo "Pull request created successfully"
          else
            echo "Failed to create pull request (status $resp)"
            exit 1
          fi

      - name: Run Copilot and Commit Changes
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }} # Authenticates the Copilot CLI
          COPILOT_PROMPT: ${{ steps.branch_info.outputs.prompt }}
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"

          echo "Running Copilot with prompt from environment variable"
          TS=$(date +%Y%m%d-%H%M%S)
          mkdir -p trello
          copilot -p "$COPILOT_PROMPT" --allow-all --silent 2>&1 | tee "trello/${TS}-${BRANCH_NAME}.md"
          echo "\n=== Git Status After Copilot ==="
          git status --short
          echo "\n=== Git Diff Summary After Copilot ==="
          git diff --stat
          
          # Stage, commit, and push any generated changes
          echo "\n=== Committing Changes ==="
          if git status --porcelain --untracked-files=all | grep -q .; then
            git config user.email "dustin@korzaan.com"
            git config user.name "Dustin Korzaan"
            git add -A
            git commit -m "Apply Copilot generated changes"
            git push origin "$BRANCH_NAME"
            echo "Changes committed and pushed to $BRANCH_NAME"
          else
            echo "No changes to commit"
          fi

