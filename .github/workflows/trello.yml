name: Trello Card Moved to Ready For Github

on:
  repository_dispatch:
    types: [trello_card_moved] # Matches event_type from Trello Butler payload

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission to create a branch reference

    steps:
      - name: Format Branch Name
        id: branch_info
        run: |
          # Cleans the Trello card name to make it web/git safe: lowercase and replace any non-alphanumeric with hyphens
          sanitize_name() {
            local sanitized
            sanitized=$(printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9]/-/g' |
              sed 's/-\+/-/g' |
              sed 's/^-//; s/-$//')
            printf '%s' "${sanitized:0:20}"
          }

          card_name=${{ toJson(github.event.client_payload.card_name) }}
          CLEAN_NAME=$(sanitize_name "$card_name")
          CARD_NUMBER="${{ github.event.client_payload.card_number }}"
          CARD_ID="${{ github.event.client_payload.card_id }}"
          
          # Formats final branch as `trello-123-your-card-title`
          echo "branch_name=trello-${CARD_NUMBER}-${CARD_ID}-${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          npm install -g @github/copilot

      - name: Create and Push Git Branch
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          echo "Creating branch: $BRANCH_NAME"
          
          # Creates and pushes the new branch based off the current default branch
          git checkout -b "$BRANCH_NAME"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Run Copilot to Generate Code
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }} # Authenticates the Copilot CLI
        run: |
          BRANCH_NAME="${{ steps.branch_info.outputs.branch_name }}"
          prompt="Try to apply this code change to this branch just based on the name: '$BRANCH_NAME'"
          echo "Prompt: $prompt"
          copilot -p "$prompt" --allow-all --silent
          echo "\n=== Git Status After Copilot ==="
          git status --short
          echo "\n=== Git Diff Summary After Copilot ==="
          git diff --stat

      - name: Commit and Push Generated Changes
        run: |
          git diff --quiet || (
            git add -A
            git commit -m "Apply Copilot generated changes"
            git push origin HEAD
          )

