name: AI 50 Run

on:
  workflow_call:
    inputs:
      ai_target:
        type: string
        required: true
      branch_name:
        type: string
        required: true
      prompt:
        type: string
        required: true
    secrets:
      COPILOT_TOKEN:
        required: true

jobs:
  run_ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        shell: bash
        run: |
          npm install -g @github/copilot

      - name: Run AI target
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_PROMPT: ${{ inputs.prompt }}
          AI_TARGET: ${{ inputs.ai_target }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail

          TS=$(date +%Y%m%d-%H%M%S)
          LOG_DIR="${RUNNER_TEMP}/ai-run-logs"
          mkdir -p "${LOG_DIR}"
          LOG_FILE="${LOG_DIR}/${TS}-${BRANCH_NAME}-${AI_TARGET}-log.md"
          echo "LOG_FILE=${LOG_FILE}" >> "$GITHUB_ENV"

          if [ "${AI_TARGET}" = "copilot" ]; then
            echo "Running Copilot for branch ${BRANCH_NAME}"
            copilot -p "${COPILOT_PROMPT}" --allow-all --silent 2>&1 | tee "${LOG_FILE}"
          else
            echo "Unsupported ai_target: ${AI_TARGET}"
            exit 1
          fi

          echo ""
          echo "=== Git Status After AI ==="
          git status --short
          echo ""
          echo "=== Git Diff Summary After AI ==="
          git diff --stat

      - name: Commit and push generated changes
        shell: bash
        run: |
          if git status --porcelain --untracked-files=all | grep -q .; then
            git config user.email "dustin@korzaan.com"
            git config user.name "Dustin Korzaan"
            git add -A
            git commit -m "Apply ${{ inputs.ai_target }} generated changes"
            git push origin "${{ inputs.branch_name }}"
            echo "Changes committed and pushed to ${{ inputs.branch_name }}"
          else
            echo "No remaining changes to commit"
          fi

      - name: Upload AI run log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-run-log-${{ inputs.ai_target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_FILE }}
          if-no-files-found: warn
          retention-days: 14

      - name: Add AI run summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## AI Run Log"
            echo ""
            echo "- Target: ${{ inputs.ai_target }}"
            echo "- Branch: ${{ inputs.branch_name }}"
            echo "- Artifact: ai-run-log-${{ inputs.ai_target }}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo ""
            if [ -n "${LOG_FILE:-}" ] && [ -f "${LOG_FILE}" ]; then
              echo "### Last 40 Log Lines"
              echo '```text'
              tail -n 40 "${LOG_FILE}"
              echo '```'
            else
              echo "Log file was not created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"