name: AI 50 Run

on:
  workflow_call:
    inputs:
      ai_target:
        type: string
        required: true
      branch_name:
        type: string
        required: true
      prompt:
        type: string
        required: true
    secrets:
      COPILOT_TOKEN:
        required: true

jobs:
  run_ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        if: ${{ inputs.ai_target == 'copilot' }}
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        shell: bash
        run: |
          npm install -g @github/copilot

      - name: Install Cursor CLI
        if: ${{ inputs.ai_target == 'cursor' }}
        shell: bash
        run: |
          npm install -g @nothumanwork/cursor-agent-cli

      - name: Run AI target
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_PROMPT: ${{ inputs.prompt }}
          AI_TARGET: ${{ inputs.ai_target }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${AI_TARGET}" = "copilot" ]; then
            echo "Running Copilot for branch ${BRANCH_NAME}"
            copilot -p "${COPILOT_PROMPT}" --allow-all --silent
          elif [ "${AI_TARGET}" = "cursor" ]; then
            echo "Running Cursor Agent for branch ${BRANCH_NAME}"
            cursor-agent --print --trust --force "${COPILOT_PROMPT}"
          else
            echo "Unsupported ai_target: ${AI_TARGET}"
            exit 1
          fi

          echo ""
          echo "=== Git Status After AI ==="
          git status --short
          echo ""
          echo "=== Git Diff Summary After AI ==="
          git diff --stat

      - name: Commit and push generated changes
        shell: bash
        run: |
          if git status --porcelain --untracked-files=all | grep -q .; then
            git config user.email "dustin@korzaan.com"
            git config user.name "Dustin Korzaan"
            git add -A
            git commit -m "Apply ${{ inputs.ai_target }} generated changes"
            git push origin "${{ inputs.branch_name }}"
            echo "Changes committed and pushed to ${{ inputs.branch_name }}"
          else
            echo "No remaining changes to commit"
          fi