name: cicd-weather1116-prod-mvc
run-name: CICD weather1116-prod-mvc

on:
  workflow_run:
    workflows:
      - build-and-test
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: prod-deploy-mvc
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read #This is required for actions/checkout
    outputs:
      build_start: ${{ steps.build_start.outputs.build_start }}

    steps:
      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build ./mvc-dotnet/mvc/WeatherMVC.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./mvc-dotnet/mvc/WeatherMVC.csproj -c Release -o "${{ github.workspace }}/publish/mvc-dotnet"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mvc-dotnet

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    env:
      UI_REACT_URL: ${{ vars.PROD_UI_REACT_URL }}
      UI_BLAZOR_URL: ${{ vars.PROD_UI_BLAZOR_URL }}
      MVC_DOTNET_URL: ${{ vars.PROD_MVC_DOTNET_URL }}
      API_DOTNET_URL: ${{ vars.PROD_API_DOTNET_URL }}
      WORKER_DOTNET_URL: ${{ vars.PROD_WORKER_DOTNET_URL }}
      MCP_APP_URL: ${{ vars.PROD_MCP_APP_URL }}
      MCP_FUNCTION_URL: ${{ vars.PROD_MCP_FUNCTION_URL }}
      BUILD_START: ${{ needs.build.outputs.build_start }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mvc-dotnet

      - name: Debug Azure OIDC secret lengths
        shell: bash
        env:
          AZURE_GITHUB_CLIENTID: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          AZURE_TENANTID: ${{ secrets.AZURE_TENANTID }}
          AZURE_SUBSCRIPTIONID: ${{ secrets.AZURE_SUBSCRIPTIONID }}
        run: |
          echo "AZURE_GITHUB_CLIENTID length=${#AZURE_GITHUB_CLIENTID}"
          echo "AZURE_TENANTID length=${#AZURE_TENANTID}"
          echo "AZURE_SUBSCRIPTIONID length=${#AZURE_SUBSCRIPTIONID}"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Set App Service settings
        uses: azure/cli@v3
        with:
          inlineScript: |
            APP_RG=$(az webapp list --query "[?name=='weather1116-prod-mvc'].resourceGroup | [0]" -o tsv)
            if [ -z "$APP_RG" ]; then
              echo "Could not resolve resource group for weather1116-prod-mvc" >&2
              exit 1
            fi

            az webapp config appsettings set \
              --name weather1116-prod-mvc \
              --resource-group "$APP_RG" \
              --settings \
                DB_CONNECTION_STRING="${{ secrets.AZURE_SQL_DB_CONNECTION_STRING }}" \
                UI_REACT_URL="${{ env.UI_REACT_URL }}" \
                UI_BLAZOR_URL="${{ env.UI_BLAZOR_URL }}" \
                MVC_URL="${{ env.MVC_DOTNET_URL }}" \
                API_DOTNET_URL="${{ env.API_DOTNET_URL }}" \
                WORKER_DOTNET_URL="${{ env.WORKER_DOTNET_URL }}" \
                MCP_APP_URL="${{ env.MCP_APP_URL }}" \
                MCP_FUNCTION_URL="${{ env.MCP_FUNCTION_URL }}" \
                GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
                AZURE_FOUNDRY_PROD_EUS2_PROJ_URL="${{ vars.AZURE_FOUNDRY_PROD_EUS2_PROJ_URL }}" \
                AZURE_FOUNDRY_PROD_EUS2_KEY="${{ secrets.AZURE_FOUNDRY_PROD_EUS2_KEY }}" \
                MCP_FUNCTION_KEY="${{ secrets.PROD_MCP_FUNCTION_KEY }}" \
                MCP_APP_KEY="${{ secrets.PROD_MCP_APP_KEY }}" \
                ASPNETCORE_ENVIRONMENT=Production \
                ASPNETCORE_DETAILEDERRORS=false \
                BUILD_NUMBER="${{ env.BUILD_NUMBER }}" \
                BUILD_START="${{ env.BUILD_START }}" \
                BUILD_BRANCH_NAME="${{ env.BUILD_BRANCH_NAME }}"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'weather1116-prod-mvc'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/mvc-dotnet
          