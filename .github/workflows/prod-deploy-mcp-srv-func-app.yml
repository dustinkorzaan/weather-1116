name: cicd-weather1116-prod-mcp-srv-func-app
run-name: CICD weather1116-prod-mcp-srv-func-app

on:
  workflow_run:
    workflows:
      - build-and-test
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: prod-deploy-mcp-srv-func-app
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.x'
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_BRANCH_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read #This is required for actions/checkout
    outputs:
      build_start: ${{ steps.build_start.outputs.build_start }}

    steps:
      - name: Record build start time
        id: build_start
        shell: bash
        run: echo "build_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build with dotnet
        run: dotnet build ./mcp-srv-func-app/mcp/WeatherMcpSrvFuncApp.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./mcp-srv-func-app/mcp/WeatherMcpSrvFuncApp.csproj -c Release -o "${{ github.workspace }}/publish/mcp-srv-func-app"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mcp-srv-func-app
          # Flex Consumption OneDeploy requires .azurefunctions at package root.
          # upload-artifact@v4+ excludes hidden (dot) files/dirs by default.
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    env:
      BUILD_START: ${{ needs.build.outputs.build_start }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish/mcp-srv-func-app

      - name: Verify Flex Consumption package contents
        shell: bash
        run: |
          PACKAGE_DIR="${{ github.workspace }}/publish/mcp-srv-func-app"
          if [ ! -d "$PACKAGE_DIR/.azurefunctions" ]; then
            echo "Missing required .azurefunctions directory in publish package:" >&2
            ls -la "$PACKAGE_DIR" >&2
            exit 1
          fi
          echo "Found .azurefunctions package content:"
          ls -la "$PACKAGE_DIR/.azurefunctions"

      - name: Debug Azure OIDC secret lengths
        shell: bash
        env:
          AZURE_GITHUB_CLIENTID: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          AZURE_TENANTID: ${{ secrets.AZURE_TENANTID }}
          AZURE_SUBSCRIPTIONID: ${{ secrets.AZURE_SUBSCRIPTIONID }}
        run: |
          echo "AZURE_GITHUB_CLIENTID length=${#AZURE_GITHUB_CLIENTID}"
          echo "AZURE_TENANTID length=${#AZURE_TENANTID}"
          echo "AZURE_SUBSCRIPTIONID length=${#AZURE_SUBSCRIPTIONID}"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_GITHUB_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}

      - name: Set Function App settings
        uses: azure/cli@v3
        with:
          inlineScript: |
            APP_RG=$(az functionapp list --query "[?name=='weather1116-prod-mcp-srv-func-app'].resourceGroup | [0]" -o tsv)
            if [ -z "$APP_RG" ]; then
              echo "Could not resolve resource group for weather1116-prod-mcp-srv-func-app" >&2
              exit 1
            fi

            az functionapp config appsettings set \
              --name weather1116-prod-mcp-srv-func-app \
              --resource-group "$APP_RG" \
              --settings \
                AZURE_FUNCTIONS_ENVIRONMENT=Production \
                BUILD_NUMBER="${{ env.BUILD_NUMBER }}" \
                BUILD_START="${{ env.BUILD_START }}" \
                BUILD_BRANCH_NAME="${{ env.BUILD_BRANCH_NAME }}"

      - name: Deploy to Azure Function App
        id: deploy-to-functionapp
        uses: Azure/functions-action@v1
        with:
          app-name: 'weather1116-prod-mcp-srv-func-app'
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish/mcp-srv-func-app
          