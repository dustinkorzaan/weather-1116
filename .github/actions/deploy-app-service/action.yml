name: Publish and deploy to Azure App Service
description: dotnet publish, zip-deploy to an Azure App Service or Function App, then upsert application settings.

inputs:
  app_kind:
    description: "'webapp' or 'functionapp'."
    required: false
    default: webapp
  csproj:
    description: Path to the .csproj to publish, relative to the repository root.
    required: true
  app_name:
    description: Target App Service / Function App resource name.
    required: true
  resource_group:
    description: Azure resource group containing the app.
    required: true
    default: wx1116-prod-rg
  secrets_multiline:
    description: |
      Multiline secret-name=secret-value lines.
      Reference secrets from env_overlay_multiline with secretref:secret-name.
    required: false
    default: ''
  env_overlay_multiline:
    description: |
      Multiline NAME=VALUE application settings, upserted alongside the
      Bicep-provisioned ones. Values may use secretref:SECRET_NAME for
      secret references.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: dotnet publish
      shell: bash
      run: dotnet publish "${{ inputs.csproj }}" -c Release -o "${RUNNER_TEMP}/publish-${{ inputs.app_name }}"

    - name: Zip publish output
      shell: bash
      working-directory: ${{ runner.temp }}/publish-${{ inputs.app_name }}
      run: zip -r "${RUNNER_TEMP}/publish-${{ inputs.app_name }}.zip" .

    - name: Deploy code
      shell: bash
      run: |
        if [ "${{ inputs.app_kind }}" = "functionapp" ]; then
          az functionapp deploy \
            --resource-group "${{ inputs.resource_group }}" \
            --name "${{ inputs.app_name }}" \
            --src-path "${RUNNER_TEMP}/publish-${{ inputs.app_name }}.zip" \
            --type zip
        else
          az webapp deploy \
            --resource-group "${{ inputs.resource_group }}" \
            --name "${{ inputs.app_name }}" \
            --src-path "${RUNNER_TEMP}/publish-${{ inputs.app_name }}.zip" \
            --type zip
        fi

    - name: Apply application settings
      shell: bash
      env:
        SETTINGS_SECRETS_MULTILINE: ${{ inputs.secrets_multiline }}
        SETTINGS_ENV_OVERLAY_MULTILINE: ${{ inputs.env_overlay_multiline }}
      run: |
        SECRETS_FILE=""
        ENV_OVERLAY_FILE=""
        if [ -n "${SETTINGS_SECRETS_MULTILINE}" ]; then
          SECRETS_FILE="${RUNNER_TEMP}/app-service-secrets-${{ inputs.app_name }}.env"
          printf '%s\n' "${SETTINGS_SECRETS_MULTILINE}" > "${SECRETS_FILE}"
        fi
        if [ -n "${SETTINGS_ENV_OVERLAY_MULTILINE}" ]; then
          ENV_OVERLAY_FILE="${RUNNER_TEMP}/app-service-env-overlay-${{ inputs.app_name }}.env"
          printf '%s\n' "${SETTINGS_ENV_OVERLAY_MULTILINE}" > "${ENV_OVERLAY_FILE}"
        fi
        bash "${GITHUB_WORKSPACE}/.github/scripts/app-service-configure.sh" \
          --app-name "${{ inputs.app_name }}" \
          --resource-group "${{ inputs.resource_group }}" \
          --app-kind "${{ inputs.app_kind }}" \
          ${SECRETS_FILE:+--secrets-file "${SECRETS_FILE}"} \
          ${ENV_OVERLAY_FILE:+--env-overlay-file "${ENV_OVERLAY_FILE}"}
