name: Build and push container image to ACR
description: Remote-build a Dockerfile with az acr build, merge secrets/env on the Container App, and update the image.

inputs:
  acr_name:
    description: Azure Container Registry name (not login server).
    required: true
  image_name:
    description: Repository name inside ACR, e.g. wx1116-api.
    required: true
  image_tag:
    description: Image tag, typically the GitHub run number.
    required: true
  dockerfile:
    description: Path to the Dockerfile relative to the repository root.
    required: true
  container_app_name:
    description: Target Container App resource name.
    required: true
  resource_group:
    description: Azure resource group containing the Container App.
    required: true
    default: wx1116-prod-rg
  secrets_multiline:
    description: |
      Multiline secret-name=secret-value lines for az containerapp secret set.
      Reference secrets from env_overlay_multiline with secretref:secret-name.
    required: false
    default: ''
  env_overlay_multiline:
    description: |
      Multiline NAME=VALUE env vars merged on top of Bicep-provisioned values.
      Values may use secretref:SECRET_NAME for secret references.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build image in ACR
      shell: bash
      run: |
        az acr build \
          --registry "${{ inputs.acr_name }}" \
          --image "${{ inputs.image_name }}:${{ inputs.image_tag }}" \
          --file "${{ inputs.dockerfile }}" \
          .

    - name: Configure secrets and merged environment
      if: inputs.secrets_multiline != '' || inputs.env_overlay_multiline != ''
      shell: bash
      env:
        ACA_SECRETS_MULTILINE: ${{ inputs.secrets_multiline }}
        ACA_ENV_OVERLAY_MULTILINE: ${{ inputs.env_overlay_multiline }}
      run: |
        SECRETS_FILE=""
        ENV_OVERLAY_FILE=""
        if [ -n "${ACA_SECRETS_MULTILINE}" ]; then
          SECRETS_FILE="${RUNNER_TEMP}/aca-secrets.env"
          printf '%s\n' "${ACA_SECRETS_MULTILINE}" > "${SECRETS_FILE}"
        fi
        if [ -n "${ACA_ENV_OVERLAY_MULTILINE}" ]; then
          ENV_OVERLAY_FILE="${RUNNER_TEMP}/aca-env-overlay.env"
          printf '%s\n' "${ACA_ENV_OVERLAY_MULTILINE}" > "${ENV_OVERLAY_FILE}"
        fi
        bash "${GITHUB_WORKSPACE}/.github/scripts/aca-container-configure.sh" \
          --container-app "${{ inputs.container_app_name }}" \
          --resource-group "${{ inputs.resource_group }}" \
          ${SECRETS_FILE:+--secrets-file "${SECRETS_FILE}"} \
          ${ENV_OVERLAY_FILE:+--env-overlay-file "${ENV_OVERLAY_FILE}"}

    - name: Update Container App image
      shell: bash
      run: |
        az containerapp update \
          --name "${{ inputs.container_app_name }}" \
          --resource-group "${{ inputs.resource_group }}" \
          --image "${{ inputs.acr_name }}.azurecr.io/${{ inputs.image_name }}:${{ inputs.image_tag }}"
