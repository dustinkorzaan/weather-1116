[project]
name = "weather-mcp-srv-python"
version = "0.1.0"
description = "Standalone Python MCP server exposing public weather forecast and history tools backed by Open-Meteo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
weather-mcp-srv-python = "weather_mcp_srv_python.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
