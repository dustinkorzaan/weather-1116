[project]
name = "foundry-console-v4-python"
version = "0.1.0"
description = "Python port of FoundryConsoleV4: Responses API with remote MCP servers as tools."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.80",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
foundry-console-v4-python = "foundry_console_v4:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["foundry_console_v4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
